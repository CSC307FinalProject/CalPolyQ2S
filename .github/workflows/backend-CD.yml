name: Build and deploy backend to Azure Web App - CalPolyQ2S

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: packages/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Test backend
        run: npm test --if-present

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Install backend production dependencies
        run: npm install --omit=dev --package-lock=false --workspaces=false --prefix .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: |
            packages/backend
            !packages/backend/.env
            !packages/backend/.env.*
            !packages/backend/node_modules/.cache

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_51236B1727C74C08A06A8C29DA690817 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2FD17E25A30C419098C7990B802E9F5F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E46C4BDF07B541AB8C79CCE8BD49CCC4 }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "CalPolyQ2S"
          slot-name: "Production"
          package: ./backend-app
